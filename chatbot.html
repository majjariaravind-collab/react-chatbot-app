<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <style>

      body{
        font-family:Arial, Helvetica, sans-serif;
        margin:0px 1px;
      }
      .send-button{
        background-color:green;
        color:white;
        padding:12px 20px;
        margin-left:10px;
        border:none;
        border-radius:10px;
        font-size:15px;
        cursor:pointer;
        background-color:rgb(25,135,84);
      }
      .chat-input{
        padding:12px 15px;
        border-radius:10px;
        border-width:1px;
        font-size:15px;
        flex-grow:1;
      }
      .chat-input-container{
        display:flex;
        margin-bottom: 60px;
  
        

      }
      .app-container{
        max-width: 600px;
        margin:0px auto;
        height:100vh;
        display:flex;
        flex-direction: column;
       
        
        
      }
      .chat-message-user{
        display:flex;
        justify-content: end;
        align-items: start;
      }
      .chat-message-text{
        
        background-color:rgb(238,238,238);
        font-family:Arial, Helvetica, sans-serif;
        padding:15px 20px;
        border-radius:10px;
        margin-right:10px;
        margin-left:10px;
        margin-bottom: 20px;
        max-width:300px;
        
        
        
      }
      .chat-message-robot{
        display:flex;
        align-items: start;
        
      }
      .chat-message-profile{
        width:40px;
      }
      .chat-message-container{
        flex-grow:1;
        margin-top:120px;
        overflow: scroll;
        scrollbar-width:none;
      }

    </style>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      function  ChatInput( {chatMessages, setChatMessages}){
       const [inputText, setInputText]= React.useState('');
        function saveInputText(event){
         setInputText( event.target.value);
        }
         async function sendMessage(){
          setInputText('');
          const newChatMessages =[
            ...chatMessages,
            {
              message:inputText,
              sender:'user',
              id:crypto.randomUUID()
            }
          ];

          setChatMessages(newChatMessages);

          const response = await Chatbot.getResponseAsync(inputText);
             setChatMessages([
            ...newChatMessages,
            {
              message:response,
              sender:'robot',
              id:crypto.randomUUID()
            }
          ]);
          
        }

        function handleKeyDown(event){
          if(event.key==="Enter"){
            sendMessage();
          }else if(event.key === "Escape"){
            setInputText("");

          }
        }



        return(
          
          <div className="chat-input-container">
            <input 
              placeholder="Send a message to Chatbot" 
              size="30" 
              onChange={saveInputText}
              onKeyDown={handleKeyDown}
              value={inputText}
              className="chat-input"
            />
            <button className="send-button" onClick={sendMessage}>Send</button>
            </div>
        
        );
      }

      function ChatMessage({message , sender}){
 
        return(
         <div className={sender === "user"?  "chat-message-user" : "chat-message-robot"}>
          {sender === 'robot' &&  ( 
            <img src="robot.png" className="chat-message-profile" />
          )}
          <div className="chat-message-text">{message}</div> 
          {sender === 'user' && (
            <img src="user.png" className="chat-message-profile" />
          )} 
          </div>
        );
      }

      function ChatMessages({chatMessages}){
       const chatMessagesRef =  React.useRef(null);
        React.useEffect(()=>{
        const containerElem = chatMessagesRef.current;
        if(containerElem){
          containerElem.scrollTop = containerElem.scrollHeight;
        }
         
        },[chatMessages]);
        return(
          <div className="chat-message-container" ref={chatMessagesRef}>
         
          {chatMessages.map((chat)=>{
          return (
            <ChatMessage message={chat.message} sender={chat.sender} key={chat.id} />
          );
          })
        }
        </div>
      );

      }
      function App(){
      
        const [chatMessages,setChatMessages]=  React.useState([
          {
            message:'hello chatbot',
            sender:'user',
            id:'id1'
            
          },
          {
            message:'Hello! How can I help you?',
            sender:'robot',
            id:'id2'
          },
          {
            message:'can you get me todays date?',
            sender:'user',
            id:'id3'
          },
          {
            message:'Today is October 27',
            sender:'robot',
            id:'id4'
          },
          {
            message:'how about flip a coin',
            sender:'user',
            id:'id5'
          }
        ]
        );

        return(
          <div className="app-container">
          <ChatMessages chatMessages={chatMessages} />
          <ChatInput chatMessages={chatMessages} setChatMessages={setChatMessages} />
          </div>
          

        );

      }
      
      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);

    </script>

  </body>

</html>
